<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔整各論Ⅱ 下肢骨折 マルバツ問題</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>柔整各論Ⅱ 下肢骨折</h1>
        <div id="quiz-container">
            <p id="question-number"></p>
            <p id="question-text"></p>
            
            <div id="choices" class="btn-group">
                <button id="btn-true" onclick="checkAnswer(true)">〇 (マル)</button>
                <button id="btn-false" onclick="checkAnswer(false)">× (バツ)</button>
            </div>

            <div id="result-area" class="hidden">
                <p id="judgement"></p>
                <p id="explanation"></p>
                <button id="btn-next" onclick="nextQuestion()">次の問題へ</button>
            </div>
        </div>
        <div id="score-container" class="hidden">
            <h2>結果発表</h2>
            <p id="score-text"></p>
            <button onclick="restartQuiz()">最初からやり直す</button>
        </div>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
